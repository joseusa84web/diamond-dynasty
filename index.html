<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Diamond Dynasty</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
button{border:0;border-radius:14px;padding:13px 8px;color:#fff;background:#23578f;font-weight:800;font-size:15px;touch-action:manipulation}
button:active{transform:scale(.97)}.app{max-width:760px;margin:auto}.top{padding:14px;background:#0b192b;position:sticky;top:0;z-index:5}.brand{display:flex;justify-content:space-between;align-items:center;font-size:17px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.tabs button{padding:10px 3px;font-size:12px}.tabs .active{background:#287ee5}
#content{padding-bottom:30px}.panel{margin:12px;padding:14px;border:1px solid #233b58;border-radius:18px;background:#0c1a2d}.score{display:grid;grid-template-columns:1fr auto 1fr;text-align:center;align-items:center}.runs{font-size:30px;font-weight:900}.mid,.small{font-size:12px;color:#9fb1c5}.count{display:flex;justify-content:space-around;padding:10px;margin-top:8px;background:#081425;border-radius:12px}
.field{height:340px;position:relative;overflow:hidden;border-radius:18px;background:#168044;border:2px solid #31533e}.diamond{position:absolute;width:210px;height:210px;left:50%;top:48%;transform:translate(-50%,-50%) rotate(45deg);background:#c99b63;border:4px solid #ead0a4}.base{position:absolute;width:22px;height:22px;background:#fff;border:2px solid #222;transform:rotate(-45deg)}.home{left:calc(50% - 11px);bottom:27px}.first{right:calc(50% - 105px);top:50%}.second{left:calc(50% - 11px);top:calc(50% - 105px)}.third{left:calc(50% - 105px);top:50%}.player{position:absolute;font-size:30px;z-index:2}.pitcher{left:50%;top:42%;transform:translate(-50%,-50%)}.batter{left:17%;bottom:34px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.power{background:#8a2934}.wait{background:#315d45}.log{padding:12px 2px;min-height:44px;font-size:14px}.new{width:100%;margin-top:8px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{padding:12px;border:1px solid #29425f;border-radius:14px;background:#101f33}.card button{width:100%;margin-top:7px}.bar{height:6px;background:#26384c;border-radius:5px;margin:4px 0 7px}.bar i{display:block;height:100%;background:#54a7ff;border-radius:5px}.hero{text-align:center;font-size:54px}.form input{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #38506b;background:#081323;color:#fff;font-size:16px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.box{background:#0d1c30;padding:22px;border-radius:20px;text-align:center;width:min(420px,100%)}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand"><b>⚾ DIAMOND DYNASTY</b><span id="xpLabel">XP 40</span></div>
<div class="tabs">
<button class="active" data-tab="game">GAME</button><button data-tab="team">TEAM</button><button data-tab="train">TRAIN</button><button data-tab="create">CREATE</button>
</div>
</header>
<main id="content"></main>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<script>
(function(){
"use strict";
const content=document.getElementById("content"), xpLabel=document.getElementById("xpLabel"), modal=document.getElementById("modal"), modalBox=document.getElementById("modalBox");
const basePlayers=[
{name:"Leo",emoji:"🦁",power:88,speed:58,vision:72,contact:78},
{name:"Flash",emoji:"🐆",power:62,speed:94,vision:76,contact:82},
{name:"Eagle",emoji:"🦅",power:70,speed:71,vision:96,contact:90},
{name:"Cobra",emoji:"🐍",power:74,speed:65,vision:88,contact:84}
];
let save={xp:40,created:null};
try{const raw=localStorage.getItem("diamondDynastySave");if(raw)save=JSON.parse(raw)}catch(e){}
let game=null;
function roster(){return basePlayers.concat(save.created?[save.created]:[])}
function persist(){try{localStorage.setItem("diamondDynastySave",JSON.stringify(save))}catch(e){}xpLabel.textContent="XP "+save.xp}
function startGame(){game={inning:1,half:"Top",outs:0,balls:0,strikes:0,runs:0,opponent:0,bases:[0,0,0],batter:0,message:"First pitch!"};drawGame()}
function player(){const r=roster();return r[game.batter%r.length]}
function drawGame(){
persist();const p=player();
content.innerHTML=
'<section class="panel"><div class="score"><div>DYNASTY<div class="runs">'+game.runs+'</div></div><div class="mid">'+game.half+'<br>INNING '+game.inning+'<br>'+game.outs+' OUT</div><div>RIVALS<div class="runs">'+game.opponent+'</div></div></div><div class="count">B '+game.balls+' &nbsp; S '+game.strikes+' &nbsp; O '+game.outs+' <span>🏃 '+game.bases.map(x=>x?"●":"○").join(" ")+'</span></div></section>'+
'<section class="panel"><div class="field"><div class="diamond"></div><div class="base home"></div><div class="base first"></div><div class="base second"></div><div class="base third"></div><div class="player pitcher">⚾</div><div class="player batter">'+p.emoji+'</div></div>'+
'<div class="actions"><button id="contact">CONTACT</button><button id="power" class="power">POWER</button><button id="wait" class="wait">WAIT</button></div><div class="log">'+game.message+'</div><button id="newGame" class="new">NEW GAME</button></section>';
document.getElementById("contact").addEventListener("click",function(){atBat("contact")});
document.getElementById("power").addEventListener("click",function(){atBat("power")});
document.getElementById("wait").addEventListener("click",function(){atBat("wait")});
document.getElementById("newGame").addEventListener("click",startGame);
}
function advanceBases(n){
let scored=0;
if(n===4){scored=1+game.bases.filter(Boolean).length;game.bases=[0,0,0];game.runs+=scored;return scored}
if(n===1){if(game.bases[2])scored++;game.bases=[1,game.bases[0],game.bases[1]]}
if(n===2){scored+=game.bases[2]?1:0;scored+=game.bases[1]?1:0;game.bases=[0,1,game.bases[0]]}
if(n===3){scored+=game.bases.filter(Boolean).length;game.bases=[0,0,1]}
game.runs+=scored;return scored
}
function changeSide(){
game.outs=0;game.balls=0;game.strikes=0;game.bases=[0,0,0];
if(game.half==="Top")game.half="Bottom";else{game.half="Top";game.inning++}
if(game.inning>3){showResult();return true}return false
}
function atBat(type){
if(!game||game.inning>3)return;
const p=player();
if(type==="wait"){game.balls++;game.message="Ball.";if(game.balls>=4){game.balls=0;game.strikes=0;advanceBases(1);game.message=p.emoji+" walks."}drawGame();return}
let chance=Math.random()*100;
chance += (type==="power"?p.power*.22:p.contact*.24)+(p.vision*.06);
if(chance<32){game.strikes++;game.message="Swing and miss!";if(game.strikes>=3){game.outs++;game.strikes=0;game.balls=0;game.message=p.emoji+" strikes out.";if(changeSide())return}}
else if(chance<48){game.strikes=Math.min(2,game.strikes+1);game.message="Foul ball."}
else if(chance<78){game.balls=0;game.strikes=0;advanceBases(1);game.message=p.emoji+" singles."}
else if(chance<91){game.balls=0;game.strikes=0;advanceBases(2);game.message=p.emoji+" doubles!"}
else if(chance<97){game.balls=0;game.strikes=0;advanceBases(3);game.message=p.emoji+" triples!"}
else{game.balls=0;game.strikes=0;advanceBases(4);game.message="💥 HOME RUN! "+p.emoji+" crushes it!"}
game.batter++;
drawGame();
}
function showResult(){modalBox.innerHTML='<div class="hero">🏆</div><h2>'+(game.runs>=game.opponent?"DYNASTY WINS!":"GAME OVER")+'</h2><p>Final '+game.runs+' - '+game.opponent+'</p><button id="again">PLAY AGAIN</button>';modal.style.display="flex";document.getElementById("again").addEventListener("click",function(){modal.style.display="none";startGame()})}
function drawTeam(){content.innerHTML='<section class="panel"><h2>🐾 Dynasty Roster</h2><div class="cards">'+roster().map(function(p){return '<div class="card"><b>'+p.emoji+' '+p.name+'</b><div>Power '+p.power+'</div><div class="bar"><i style="width:'+p.power+'%"></i></div><div>Speed '+p.speed+'</div><div class="bar"><i style="width:'+p.speed+'%"></i></div><div>Vision '+p.vision+'</div><div class="bar"><i style="width:'+p.vision+'%"></i></div><div>Contact '+p.contact+'</div></div>'}).join("")+'</div></section>'}
function drawTrain(){content.innerHTML='<section class="panel"><h2>🏋️ Training</h2><p class="small">20 XP = +2 attribute.</p><div class="cards">'+roster().map(function(p,i){return '<div class="card"><b>'+p.emoji+' '+p.name+'</b><button data-i="'+i+'" data-stat="power">Power +2</button><button data-i="'+i+'" data-stat="contact">Contact +2</button><button data-i="'+i+'" data-stat="speed">Speed +2</button></div>'}).join("")+'</div></section>';content.querySelectorAll("button[data-stat]").forEach(function(b){b.addEventListener("click",function(){train(Number(b.dataset.i),b.dataset.stat)})})}
function train(i,stat){if(save.xp<20){alert("Need 20 XP");return}const r=roster()[i];if(save.created&&r.name===save.created.name)save.created[stat]=Math.min(99,save.created[stat]+2);else{const b=basePlayers.find(function(x){return x.name===r.name});if(b)b[stat]=Math.min(99,b[stat]+2)}save.xp-=20;persist();drawTrain()}
function drawCreate(){content.innerHTML='<section class="panel form"><div class="hero">🧬</div><h2>Create Player</h2><input id="playerName" placeholder="Name"><input id="animal" value="🐺" placeholder="Animal emoji"><button id="savePlayer" class="new">SAVE PLAYER</button></section>';document.getElementById("savePlayer").addEventListener("click",function(){const n=document.getElementById("playerName").value.trim()||"Rookie",e=document.getElementById("animal").value.trim()||"🐺";save.created={name:n,emoji:e,power:75,speed:75,vision:75,contact:75};persist();drawCreate();alert("Player created!")})}
document.querySelectorAll("[data-tab]").forEach(function(btn){btn.addEventListener("click",function(){document.querySelectorAll("[data-tab]").forEach(function(x){x.classList.remove("active")});btn.classList.add("active");const t=btn.dataset.tab;if(t==="game"){if(!game)startGame();else drawGame()}else if(t==="team")drawTeam();else if(t==="train")drawTrain();else drawCreate()})});
startGame();
})();
</script>
</body>
</html>
