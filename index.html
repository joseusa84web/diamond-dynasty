<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07130d"><title>Diamond Dynasty 2.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#06100b;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:flex;justify-content:center}#app{width:min(100%,520px);padding:10px 10px 24px}header{display:flex;justify-content:space-between;align-items:center;background:#0c1c13;border:1px solid #294b34;border-radius:16px;padding:12px 14px;margin-bottom:10px}.logo{font-weight:900;letter-spacing:1px}.sub{font-size:10px;color:#8fa696}.score{text-align:right;font-weight:900}.score small{display:block;color:#8fa696;font-size:10px}.panel{background:#0b1811;border:1px solid #294b34;border-radius:16px;padding:10px;margin-bottom:10px}#hud{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}.stat{background:#07110c;border-radius:10px;padding:7px;text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:9px;color:#8fa696}canvas{display:block;width:100%;height:auto;border-radius:16px;border:1px solid #315c3c;touch-action:none}.controls,#pitchControls,#fieldControls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}#fieldControls{grid-template-columns:repeat(4,1fr)}button{border:0;border-radius:13px;padding:13px 7px;font-weight:900;color:#fff;background:#183824;font-size:12px;min-height:48px}button:active{transform:scale(.97)}.primary{background:#a56b18}.danger{background:#6b2222}.blue{background:#174d72}#menu{display:flex;gap:7px;margin-bottom:10px}#menu button{min-height:40px;font-size:10px;padding:7px;background:#102419}#message{min-height:44px;text-align:center;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}.hidden{display:none!important}#overlay{position:fixed;inset:0;background:rgba(0,0,0,.84);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.card{width:min(100%,440px);background:#0b1811;border:1px solid #315c3c;border-radius:22px;padding:22px;text-align:center}.card h1{font-size:29px;margin:0 0 8px}.card p{color:#9bb1a1;line-height:1.45}.card button{width:100%;margin-top:12px}
</style></head><body>
<div id="app">
<header><div><div class="logo">⚾ DIAMOND DYNASTY</div><div class="sub">PLAYABLE CORE 2.0</div></div><div class="score"><span id="score">0 - 0</span><small id="inning">TOP 1</small></div></header>
<div id="menu"><button onclick="newGame()">NEW GAME</button><button onclick="resetSave()">RESET</button><button onclick="showRoster()">ROSTER</button></div>
<div class="panel" id="hud"><div class="stat"><b id="outs">0</b><span>OUTS</span></div><div class="stat"><b id="count">0-0</b><span>COUNT</span></div><div class="stat"><b id="bases">—</b><span>BASES</span></div><div class="stat"><b id="batter">Leo</b><span>BATTER</span></div></div>
<canvas id="field" width="500" height="650"></canvas>
<div class="panel" id="message">Tap PLAY BALL.</div>
<div class="panel">
<div id="pitchControls"><button onclick="choosePitch('fastball')">FASTBALL</button><button onclick="choosePitch('slider')">SLIDER</button><button onclick="choosePitch('changeup')">CHANGEUP</button></div>
<div id="fieldControls" style="display:none"><button onclick="fieldThrow('1B')">THROW 1B</button><button onclick="fieldThrow('2B')">THROW 2B</button><button onclick="fieldThrow('3B')">THROW 3B</button><button onclick="fieldThrow('HOME')">THROW HOME</button></div>
<div class="controls" style="margin-top:8px"><button class="primary" onclick="swing('contact')">CONTACT SWING</button><button class="danger" onclick="swing('power')">POWER SWING</button><button class="blue" onclick="takePitch()">TAKE PITCH</button></div>
</div>
<div class="panel" style="font-size:11px;color:#8fa798;text-align:center">Time the swing when the ball reaches the plate. Your animal's attributes change the odds.</div>
</div>
<div id="overlay"><div class="card"><h1>⚾ Diamond Dynasty</h1><p>Playable baseball core: pitching, timing, hitting, outs, bases, scoring, innings and defense.</p><button class="primary" onclick="startFromOverlay()">PLAY BALL</button></div></div>
<script>
(function(){
"use strict";
const c=document.getElementById("field"),x=c.getContext("2d"),score=document.getElementById("score"),inn=document.getElementById("inning"),outs=document.getElementById("outs"),count=document.getElementById("count"),bases=document.getElementById("bases"),batter=document.getElementById("batter"),msg=document.getElementById("message"),pc=document.getElementById("pitchControls"),fc=document.getElementById("fieldControls"),ov=document.getElementById("overlay");
const players=[{name:"Leo",e:"🦁",p:88,s:58,v:72,co:78},{name:"Flash",e:"🐆",p:62,s:94,v:76,co:82},{name:"Eagle",e:"🦅",p:70,s:71,v:96,co:90},{name:"Cobra",e:"🐍",p:74,s:65,v:88,co:84}];
let g=null,raf=0;
function fresh(){return{inning:1,half:"Top",outs:0,balls:0,strikes:0,away:0,home:0,b:[0,0,0],bat:0,pitch:null,ps:0,pe:0,px:250,py:105,phase:"batting",play:null,message:"Choose a pitch."}}
window.startFromOverlay=function(){ov.classList.add("hidden");newGame()};
window.newGame=function(){g=fresh();draw()};
window.resetSave=function(){localStorage.removeItem("diamondDynastySave");g=fresh();g.message="Save reset.";draw()};
window.showRoster=function(){if(!g)g=fresh();g.message=players.map(a=>a.e+" "+a.name+" P"+a.p+" C"+a.co+" S"+a.s+" V"+a.v).join(" • ");draw()};
function field(){
x.clearRect(0,0,500,650);x.fillStyle="#174526";x.fillRect(0,0,500,650);x.fillStyle="#205b32";x.beginPath();x.arc(250,370,275,Math.PI,0);x.fill();
x.fillStyle="#b99564";x.beginPath();x.moveTo(250,525);x.lineTo(85,355);x.lineTo(250,185);x.lineTo(415,355);x.closePath();x.fill();x.strokeStyle="#fff";x.lineWidth=4;x.stroke();
x.fillStyle="#fff";[[250,520],[85,355],[250,185],[415,355]].forEach(q=>x.fillRect(q[0]-6,q[1]-6,12,12));x.fillStyle="#c9a77b";x.beginPath();x.arc(250,355,42,0,Math.PI*2);x.fill();x.fillStyle="#fff";x.font="900 18px system-ui";x.textAlign="center";x.fillText("HOME",250,555);x.fillText("2B",250,175);x.fillText("1B",440,365);x.fillText("3B",60,365);
if(g.half==="Top"){x.font="42px system-ui";x.fillText(players[g.bat].e,250,590)}else{x.font="40px system-ui";x.fillText("🧤",250,590)}
if(g.pitch){x.fillStyle="#fff";x.beginPath();x.arc(g.px,g.py,9,0,Math.PI*2);x.fill();x.strokeStyle="#b22";x.lineWidth=2;x.stroke()}
if(g.play){x.fillStyle="#ffd76a";x.font="900 20px system-ui";x.fillText("BALL IN PLAY",250,100)}
}
function draw(){
if(!g)g=fresh();score.textContent=g.away+" - "+g.home;inn.textContent=(g.half==="Top"?"TOP ":"BOT ")+g.inning;outs.textContent=g.outs;count.textContent=g.balls+"-"+g.strikes;
let bs=(g.b[0]?"1B ":"")+(g.b[1]?"2B ":"")+(g.b[2]?"3B":"");bases.textContent=bs||"—";batter.textContent=players[g.bat].name;msg.textContent=g.message;
pc.style.display=g.half==="Top"?"grid":"none";fc.style.display=g.half==="Bottom"?"grid":"none";field()
}
function animate(){
let t=Math.min(1,(performance.now()-g.ps)/(g.pe-g.ps));g.px=250+Math.sin(t*Math.PI*2)*(g.pitch==="slider"?58:g.pitch==="changeup"?22:12);g.py=105+t*410;field();
if(t<1){raf=requestAnimationFrame(animate)}else{g.phase="waiting";g.message="SWING NOW!";draw();setTimeout(()=>{if(g.phase==="waiting")finish(false)},180)}
}
window.choosePitch=function(type){
if(!g||g.half!=="Top"||g.phase!=="batting")return;g.pitch=type;g.phase="pitching";g.ps=performance.now();g.pe=g.ps+(type==="changeup"?1150:type==="slider"?900:760);g.message=type.toUpperCase()+" coming...";draw();animate()
};
window.swing=function(kind){
if(!g||(g.phase!=="pitching"&&g.phase!=="waiting"))return;let d=Math.abs(performance.now()-g.pe),p=players[g.bat];
if(d>310){finish(true);return}let timing=Math.max(0,1-d/300),chance=Math.min(.97,.20+timing*.48+p.co/210+p.v/500)*(kind==="power"?.95:1),q=timing+p.co/200+Math.random()*.2;
if(Math.random()>chance){finish(true);return}g.pitch=null;g.phase="running";g.message=q>.95?"SMOKED!":q>.72?"HARD CONTACT!":"CONTACT!";draw();setTimeout(()=>hit(q,kind),300)
};
window.takePitch=function(){if(!g||(g.phase!=="pitching"&&g.phase!=="waiting"))return;finish(false)};
function finish(miss){
g.pitch=null;g.phase="batting";if(miss){g.strikes++;g.message="SWING AND MISS"}else{g.balls++;g.message="BALL"}
if(g.strikes>=3){g.strikes=0;g.balls=0;out("STRIKEOUT!");return}
if(g.balls>=4){g.strikes=0;g.balls=0;walk();g.message="WALK!";draw();return}draw()
}
function hit(q,kind){
let p=players[g.bat],r=Math.random(),n=1,pow=p.p/100;
if(kind==="power"&&q>.9&&r<.16+pow*.18)n=4;else if(q>.92&&r<.12+pow*.18)n=3;else if(q>.78&&r<.25+pow*.2)n=2;
if(n===4){g.away++;g.message="HOME RUN! "+p.e+" "+p.name+" crushes it!";resetAB();draw();return}advance(n);g.message=(n===3?"TRIPLE!":n===2?"DOUBLE!":"SINGLE!")+" "+p.name+"!";resetAB();draw()
}
function advance(n){
let z=[0,0,0],runs=0;for(let i=2;i>=0;i--)if(g.b[i]){let d=i+n;if(d>=3)runs++;else z[d]=1}
if(n===1){if(g.b[0])z[1]=1;else z[0]=1;if(g.b[1])z[2]=1}g.b=z;g.away+=runs
}
function walk(){advance(1)}
function resetAB(){g.bat=(g.bat+1)%players.length;g.balls=0;g.strikes=0}
function out(t){g.outs++;g.message=t;if(g.outs>=3){g.outs=0;g.b=[0,0,0];half()}else{resetAB();draw()}}
function half(){
if(g.half==="Top"){g.half="Bottom";g.phase="fielding";g.message="DEFENSE: AI is batting.";draw();setTimeout(aiBat,600)}
else{g.half="Top";g.inning++;g.b=[0,0,0];g.bat=0;if(g.inning>3){end();return}g.phase="batting";g.message="NEW INNING — YOU BAT";draw()}
}
function aiBat(){
if(g.half!=="Bottom")return;g.phase="fielding";let r=Math.random();
if(r<.43){g.play={n:r<.13?4:r<.27?2:1};g.message="AI HIT! Choose a throw.";draw()}else{g.outs++;g.message="AI batter OUT!";if(g.outs>=3){g.outs=0;half()}else{draw();setTimeout(aiBat,500)}}
}
window.fieldThrow=function(target){
if(g.half!=="Bottom"||!g.play)return;let success=Math.random()<.72,n=g.play.n;g.play=null;
if(success){g.outs++;g.message="GREAT THROW TO "+target+" — OUT!"}else{oppAdvance(n);g.message="SAFE! RUNNER ADVANCES."}
if(g.outs>=3){g.outs=0;half()}else{draw();setTimeout(aiBat,650)}
};
function oppAdvance(n){if(n>=3)g.home++;else if(n===2)g.home++;else{if(g.b[2])g.home++;g.b=[1,g.b[0],g.b[1]]}}
function end(){g.phase="done";g.message=g.away>g.home?"🏆 DYNASTY WINS!":g.away===g.home?"DRAW GAME":"RIVALS WIN";localStorage.setItem("diamondDynastySave",JSON.stringify(g));draw()}
draw();
})();
</script></body></html>
