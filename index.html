<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Diamond Dynasty 1.0</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5ff;font-family:system-ui,sans-serif}button{border:0;border-radius:14px;padding:12px;color:white;background:#1b4775;font-weight:800}button:active{transform:scale(.97)}.app{max-width:760px;margin:auto}.top{padding:15px;background:#0b192b;position:sticky;top:0;z-index:5}.brand{display:flex;justify-content:space-between}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.tabs button{padding:9px 3px;font-size:12px}.on{background:#287ee5!important}.panel{margin:12px;padding:14px;border:1px solid #233b58;border-radius:18px;background:#0c1a2d}.score{display:grid;grid-template-columns:1fr auto 1fr;text-align:center;align-items:center}.runs{font-size:30px;font-weight:900}.mid,.small{font-size:12px;color:#9fb1c5}.count{display:flex;justify-content:space-around;padding:10px;margin-top:8px;background:#081425;border-radius:12px}.field{height:340px;position:relative;overflow:hidden;border-radius:18px;background:#168044;border:2px solid #31533e}.d{position:absolute;width:210px;height:210px;left:50%;top:48%;transform:translate(-50%,-50%) rotate(45deg);background:#c99b63;border:4px solid #ead0a4}.base{position:absolute;width:22px;height:22px;background:#fff;border:2px solid #222;transform:rotate(-45deg)}.home{left:calc(50% - 11px);bottom:27px}.b1{right:calc(50% - 105px);top:50%}.b2{left:calc(50% - 11px);top:calc(50% - 105px)}.b3{left:calc(50% - 105px);top:50%}.pl{position:absolute;font-size:28px;z-index:2}.pitch{left:50%;top:42%;transform:translate(-50%,-50%)}.bat{left:17%;bottom:34px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.power{background:#8a2934}.wait{background:#315d45}.log{padding:10px 2px;min-height:42px;font-size:13px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{padding:12px;border:1px solid #29425f;border-radius:14px;background:#101f33}.card button{width:100%;margin-top:5px}.bar{height:6px;background:#26384c;border-radius:5px;margin:4px 0 7px}.bar i{display:block;height:100%;background:#54a7ff;border-radius:5px}.hero{text-align:center;font-size:54px}.form input{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #38506b;background:#081323;color:#fff}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}.box{background:#0d1c30;padding:22px;border-radius:20px;text-align:center;width:min(420px,100%)} </style></head><body><div class="app"><header class="top"><div class="brand"><b>⚾ DIAMOND DYNASTY</b><span id="xp">XP 40</span></div><div class="tabs"><button class="on" data-t="game">GAME</button><button data-t="team">TEAM</button><button data-t="train">TRAIN</button><button data-t="create">CREATE</button></div></header><main id="s"></main></div><div id="m" class="modal"><div class="box" id="mt"></div></div><script>
const xpEl=document.getElementById('xp'), screenEl=document.getElementById('s'), modalEl=document.getElementById('m'), modalTextEl=document.getElementById('mt');
const base=[['Leo','🦁',88,58,72,78],['Flash','🐆',62,94,76,82],['Eagle','🦅',70,71,96,90],['Cobra','🐍',74,65,88,84]];let save=JSON.parse(localStorage.dd||'null')||{xp:40,created:null},g=null;
const players=()=>base.map(x=>({name:x[0],e:x[1],power:x[2],speed:x[3],vision:x[4],contact:x[5]})).concat(save.created?[save.created]:[]);
function persist(){localStorage.setItem('dd',JSON.stringify(save));xpEl.textContent='XP '+save.xp}
function newGame(){g={inn:1,half:'Top',outs:0,b:0,st:0,a:0,h:0,bs:[0,0,0],idx:0,log:'First pitch!'};render()}
function cur(){return players()[g.idx%players().length]}
function play(type){if(g.outs>=3||g.inn>3)return;let p=cur(),q=(Math.random()*100)+(type==='power'?p.power*.35:type==='wait'?p.vision*.25:p.contact*.35);
if(type==='wait'){g.b++;g.log='Taken for a ball.';if(g.b>=4){g.b=0;g.st=0;advance(1,true)}return render()}
if(q<35){g.st++;g.log='Swing and miss!';if(g.st>=3){g.outs++;g.b=g.st=0;g.log=p.e+' strikes out.';side()}}
else if(q<55){g.st=Math.min(2,g.st+1);g.log='Foul ball.'}
else if(q<79){g.b=g.st=0;g.log=p.e+' singles.';advance(1)}
else if(q<91){g.b=g.st=0;g.log=p.e+' doubles!';advance(2)}
else if(q<97){g.b=g.st=0;g.log=p.e+' triples!';advance(3)}
else{g.b=g.st=0;g.log='HOME RUN! '+p.e+' crushes it!';g.a+=1+g.bs.filter(Boolean).length;g.bs=[0,0,0]}
g.idx++;render()}
function advance(n,walk=false){if(n===1){if(g.bs[2])g.a++;g.bs=[1,g.bs[0],g.bs[1]]}if(n===2){g.a+=g.bs[1]+g.bs[2];g.bs=[0,1,g.bs[0]]}if(n===3){g.a+=g.bs.filter(Boolean).length;g.bs=[0,0,1]}g.idx++}
function side(){if(g.outs<3)return;g.outs=0;g.b=g.st=0;g.bs=[0,0,0];if(g.half==='Top')g.half='Bottom';else{g.half='Top';g.inn++}if(g.inn>3){g.log='Game over';show('<div class="hero">🏆</div><h2>'+(g.a>=g.h?'DYNASTY WINS!':'GAME OVER')+'</h2><p>Final '+g.a+' - '+g.h+'</p><button onclick="closeM()">NEW GAME</button>')}}
function show(x){modalTextEl.innerHTML=x;modalEl.style.display='flex'}function closeM(){modalEl.style.display='none';newGame()}
function render(){persist();let p=cur();screenEl.innerHTML='<section class="panel"><div class="score"><div>DYNASTY<div class="runs">'+g.a+'</div></div><div class="mid">'+g.half+'<br>INNING '+g.inn+'<br>'+g.outs+' OUT</div><div>RIVALS<div class="runs">'+g.h+'</div></div></div><div class="count">B '+g.b+' &nbsp; S '+g.st+' &nbsp; O '+g.outs+' <span>🏃 '+g.bs.map(x=>x?'●':'○').join(' ')+'</span></div></section><section class="panel"><div class="field"><div class="d"></div><div class="base home"></div><div class="base b1"></div><div class="base b2"></div><div class="base b3"></div><div class="pl pitch">⚾</div><div class="pl bat">'+p.e+'</div></div><div class="actions"><button onclick="play('contact')">CONTACT</button><button class="power" onclick="play('power')">POWER</button><button class="wait" onclick="play('wait')">WAIT</button></div><div class="log">'+g.log+'</div><button onclick="newGame()" style="width:100%">NEW GAME</button></section>'}
function team(){s.innerHTML='<section class="panel"><h2>🐾 Dynasty Roster</h2><div class="cards">'+players().map(p=>'<div class="card"><b>'+p.e+' '+p.name+'</b><div>Power '+p.power+'</div><div class="bar"><i style="width:'+p.power+'%"></i></div><div>Speed '+p.speed+'</div><div class="bar"><i style="width:'+p.speed+'%"></i></div><div>Vision '+p.vision+'</div><div class="bar"><i style="width:'+p.vision+'%"></i></div><div>Contact '+p.contact+'</div></div>').join('')+'</div></section>'}
function train(){s.innerHTML='<section class="panel"><h2>🏋️ Training</h2><p class="small">20 XP = +2 attribute.</p><div class="cards">'+players().map((p,i)=>'<div class="card"><b>'+p.e+' '+p.name+'</b><button onclick="up('+i+',\'power\')">Power +2</button><button onclick="up('+i+',\'contact\')">Contact +2</button><button onclick="up('+i+',\'speed\')">Speed +2</button></div>').join('')+'</div></section>'}
function up(i,k){if(save.xp<20)return alert('Need 20 XP');let p=players()[i];if(p.name===save.created?.name){save.created[k]=Math.min(99,save.created[k]+2)}else{let b=base.find(x=>x[0]===p.name);b[({power:2, speed:3, contact:5})[k]]+=2}save.xp-=20;persist();train()}
function create(){s.innerHTML='<section class="panel form"><div class="hero">🧬</div><h2>Create Player</h2><input id="n" placeholder="Name"><input id="e" value="🐺" placeholder="Animal emoji"><button onclick="make()">SAVE PLAYER</button></section>'}
function make(){save.created={name:n.value||'Rookie',e:e.value||'🐺',power:75,speed:75,vision:75,contact:75};persist();alert('Player created!');create()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');({game:()=>{if(!g)newGame();else render()},team,train,create}[b.dataset.t])()});newGame();
</script></body></html>
